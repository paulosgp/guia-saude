<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Encaminha APS">
  <!-- Ícone do Encaminha APS: duas setas que se cruzam (referência e contrarreferência) no
       rosa do app, que o Paulo escolheu em 14/09/2026 para não confundir com o Planifica. -->
  <rect width="64" height="64" rx="12" fill="#8c2a5a"/>
  <path d="M14 24h26l-6-6" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 24l-6 6" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 40H24l6-6" fill="none" stroke="#f7d3e4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 40l6 6" fill="none" stroke="#f7d3e4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
